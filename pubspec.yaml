name: disrupton_app
description: Aplicación de realidad aumentada para exploración cultural

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=2.17.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  # Realidad Aumentada
  ar_flutter_plugin_updated: ^0.0.1
  webview_flutter: ^4.2.2
  
  # Visor 3D (NUEVO)
  model_viewer_plus: ^1.7.0
  # Alternativa para visor 3D:
  # flutter_3d_viewer: ^1.0.0
  
  # Estado y navegación
  provider: ^6.1.2
  go_router: ^10.1.2
  
  vector_math: ^2.1.4 
  
  # HTTP y API
  http: ^1.2.1
  dio: ^5.3.2
  http_parser: ^4.0.2
  
  # Almacenamiento local
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3
  path_provider_platform_interface: ^2.0.6
  flutter_secure_storage: ^9.2.2
  
  # Cámara y permisos
  camera: ^0.10.6
  permission_handler: ^11.3.1
  camera_platform_interface: ^2.8.1
  camera_android: ^0.10.9
  camera_avfoundation: ^0.9.16+1
  
  # Procesamiento de imágenes y multimedia
  image_picker: ^1.1.2
  image_picker_platform_interface: ^2.9.0
  mime: ^1.0.4
  path: ^1.9.0
  
  # Manejo de archivos y descarga (NUEVO)
  open_file: ^3.3.2
  share_plus: ^7.2.1
  file_picker: ^8.1.4  
  #Descarga de ZIP
  archive: ^4.0.7  # UI y animaciones
  cupertino_icons: ^1.0.6
  lottie: ^3.3.1
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  
  # Utilidades
  intl: ^0.19.0
  url_launcher: ^6.2.1
  
  # Conectividad y red (NUEVO)
  connectivity_plus: ^5.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/models/
    - assets/animations/
  
  # fonts:
  #   - family: Roboto
  #     fonts:
  #       - asset: assets/fonts/Roboto-Regular.ttf
  #       - asset: assets/fonts/Roboto-Bold.ttf
  #         weight: 700