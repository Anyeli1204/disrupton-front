name: disrupton_app
description: Aplicación de realidad aumentada para exploración cultural

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=2.17.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  # Firebase para autenticación
  firebase_core: ^4.2.0
  firebase_auth: ^6.1.0
  google_sign_in: ^6.2.0
  android_intent_plus: ^5.3.1
  
  # Realidad Aumentada (temporalmente comentado por problemas de namespace)
  # ar_flutter_plugin: ^0.7.3
  model_viewer_plus: ^1.8.0
  
  # Estado y navegación
  provider: ^6.0.5
  go_router: ^10.1.2
  
  # HTTP y API
  http: ^1.1.0
  dio: ^5.3.2
  http_parser: ^4.0.2
  
  # Almacenamiento local
  shared_preferences: ^2.2.2
  path_provider: ^2.1.1
  
  # JWT y autenticación
  jwt_decoder: ^2.0.1
  
  # Cámara y permisos
  camera: ^0.11.2
  permission_handler: ^12.0.1
  image_picker: ^1.0.4
  
  # UI y animaciones
  cupertino_icons: ^1.0.2
  lottie: ^2.7.0
  
  # Utilidades
  intl: ^0.18.1
  url_launcher: ^6.2.1
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/departamentos_images/
    - assets/images/ar_images/
    - assets/images/ar_images/arequipa_ar_images/
    - assets/images/ar_images/cusco_ar_images/
    - assets/images/ar_images/ica_ar_images/
    - assets/images/ar_images/lima_ar_images/
    - assets/images/ar_images/loreto_ar_images/
    - assets/images/ar_images/puno_ar_images/
    - assets/images/event_images/
    - assets/images/post_images/
    - assets/images/productos_images/
    - assets/images/servicios_images/
    - assets/models/
    - assets/3D_models/
    - assets/animations/
  
  fonts:
    - family: RobotoMono
      fonts:
        - asset: assets/fonts/RobotoMono-Regular.ttf
        - asset: assets/fonts/RobotoMono-Bold.ttf
          weight: 700
        - asset: assets/fonts/RobotoMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/RobotoMono-Light.ttf
          weight: 300
